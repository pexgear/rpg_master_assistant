[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "canon-keeper"
# One source of truth: canon_keeper/__init__.py. The release workflow refuses
# to build if the git tag disagrees with it.
dynamic = ["version"]
description = "A dockable desktop assistant for running D&D 5e: characters, cities, and NPC conversation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["dnd", "ttrpg", "dungeon-master", "qt", "desktop"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment :: Role-Playing",
]
dependencies = [
  "PySide6>=6.6",
  "platformdirs>=4.0",
  # Saved session passwords go to the OS credential store, never a file.
  "keyring>=25.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
# The autopilot agent. A separate package that talks over the wire, so
# installing it does not change what the app itself needs -- and so the app
# keeps working with no key and no internet.
agent = ["anthropic>=0.40", "websockets>=12.0"]
# Say what you mean and have it become real messages at the table. Holds one
# login and has exactly that login's authority.
mcp = ["mcp>=2.0", "websockets>=12.0"]
whisper = ["faster-whisper>=1.0"]
dev = [
  "pytest>=8.0",
  "pytest-qt>=4.4",
  # The agent and its responder are asyncio, not Qt.
  "pytest-asyncio>=0.24",
  # A hung test used to run until GitHub killed the whole job at its six-hour
  # ceiling, which reads as "cancelled" and names nothing. This makes it fail,
  # in seconds, saying which test.
  "pytest-timeout>=2.3",
  "build>=1.0",
  "twine>=5.0",
  # The headless client and the two things built on it are tested here too.
  "websockets>=12.0",
  "mcp>=2.0",
  # Not because the app needs it -- that is the `agent` extra, and optional --
  # but because CI without it is a different machine from the one the code was
  # written on. That difference hid a hanging test for a month: the agent's
  # "you have not installed anthropic" dialog only ever appeared on CI, where
  # nobody could click it.
  "anthropic>=0.40",
]

[project.urls]
Homepage = "https://github.com/pexgear/dnd_master_assistant"
Issues = "https://github.com/pexgear/dnd_master_assistant/issues"

[project.scripts]
canonkeeper = "canon_keeper.__main__:main"
canonkeeper-server = "canon_keeper.server_main:main"
canonkeeper-agent = "canon_keeper_dm_agent.__main__:main"
canonkeeper-player = "canon_keeper_player_agent.__main__:main"
canonkeeper-mcp = "canon_keeper_mcp.__main__:main"

[project.gui-scripts]
canonkeeper-gui = "canon_keeper.__main__:main"

# First-party panels load through exactly the same entry-point group that
# third-party plugins use. If it breaks for us, it breaks for them.
[project.entry-points."canonkeeper.panels"]
characters = "canon_keeper.panels.characters:CharactersPanel"
cities = "canon_keeper.panels.cities:CitiesPanel"
encounter = "canon_keeper.panels.encounter:EncounterPanel"
transcript = "canon_keeper.panels.transcript:TranscriptPanel"
table = "canon_keeper.panels.table:TablePanel"

[tool.hatch.version]
path = "canon_keeper/__init__.py"

[tool.hatch.build.targets.wheel]
# The protocol package ships inside this wheel for now. It is a separate
# package, and stays stdlib-only, so it can be published on its own the moment
# something outside this repository needs to speak the wire without Qt.
packages = [
  "canon_keeper",
  "canon_keeper_core",
  "canon_keeper_protocol",
  "canon_keeper_client",
  "canon_keeper_dm_agent",
  "canon_keeper_player_agent",
  "canon_keeper_mcp",
]

# The SRD data and the one-shot templates are data files inside the package;
# hatchling includes them, but say so rather than rely on it.
[tool.hatch.build.targets.sdist]
include = ["canon_keeper*", "tests", "*.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# The agent is asyncio; marking every coroutine test by hand is noise.
asyncio_mode = "auto"
# Generous next to the slowest real test (a socket round trip waits ten
# seconds) and far short of anything a person would sit through. A test that
# passes this is not slow, it is stuck.
timeout = 120
# Qt tests block in C++, where a signal cannot land. A thread can still kill it.
timeout_method = "thread"
